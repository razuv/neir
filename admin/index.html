<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>NEIR — управление сайтом</title><link rel="stylesheet" href="admin.css"><script src="../runtime-config.js" defer></script><script src="../content-defaults.js" defer></script><script src="admin.js" defer></script></head><body>
<section id="login-screen" class="login-screen"><form id="login-form" class="login-card"><a href="../" class="wordmark">NEIR<span> / ADMIN</span></a><h1>Управление сайтом</h1><p>Тексты, кейсы и медиа — в одном месте.</p><label>Логин<input name="username" value="neiradmin" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Войти</button><p id="login-status" role="status"></p></form></section>
<div id="workspace" hidden><aside><a href="../" target="_blank" rel="noopener" class="wordmark">NEIR<span> / ADMIN</span></a><nav aria-label="Разделы админки"><button type="button" data-tab="visual" aria-current="page">Редактор сайта <span>01</span></button><button type="button" data-tab="texts">Все тексты <span>02</span></button><button type="button" data-tab="services">Услуги <span>02</span></button><button type="button" data-tab="cases">Кейсы <span>03</span></button><button type="button" data-tab="settings">Настройки <span>04</span></button></nav><div class="sidebar-bottom"><a href="../" target="_blank" rel="noopener">Открыть сайт ↗</a><button id="export" type="button">Скачать копию контента</button><button id="logout" type="button">Выйти</button></div></aside><main><header><div><p class="eyebrow">КОНТЕНТ ЛЕНДИНГА</p><h1 id="panel-title">Тексты</h1></div><div class="header-actions"><span id="save-state" role="status">Все изменения опубликованы</span><button id="preview" type="button" class="secondary">Предпросмотр</button><button id="publish" type="button" class="primary">Опубликовать</button></div></header><div id="notice" role="status"></div><div id="draft-banner" hidden>В этом браузере есть неопубликованный черновик. <button id="restore-draft" type="button">Восстановить</button><button id="discard-draft" type="button">Удалить черновик</button></div><section id="panel"></section></main></div>
<dialog id="preview-dialog"><div class="preview-toolbar"><strong>Предпросмотр черновика</strong><span>Изменения ещё не опубликованы</span><button id="close-preview" type="button" class="secondary">Закрыть</button></div><iframe id="preview-frame" title="Предпросмотр лендинга"></iframe></dialog><dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-message"></p><div class="actions"><button id="confirm-cancel" type="button" class="secondary">Отмена</button><button id="confirm-ok" type="button" class="primary">Подтвердить</button></div></dialog></body></html>
